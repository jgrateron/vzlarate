# ============================================================
# VzlaRate — Application Configuration
# ============================================================

spring.application.name=vzlarate

# ----- App -----
# Inyectada por Maven desde el pom (resource filtering): @project.version@ -> 1.0.0
app.version=@project.version@

# ----- Thymeleaf -----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ----- DevTools -----
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ----- BCV Scraper -----
bcv.scraper.timeout=15000
bcv.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

# ----- Static resources: content fingerprinting (hashed URLs) so browsers
# never serve stale CSS/JS, even behind proxies that strip Cache-Control -----
spring.web.resources.chain.strategy.content.enabled=true

# ----- Server -----
server.port=${PORT:8080}

# ----- Logging -----
logging.level.com.vzlarate=INFO
