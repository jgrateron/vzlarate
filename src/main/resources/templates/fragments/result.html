<!-- Fragment: Conversion result — returned by HTMX on POST /convert -->

<!-- Error state -->
<div th:if="${error != null}" id="result-section" class="result-area">
    <div class="result-card result-error" role="alert">
        <span class="result-error-icon">&#x26A0;</span>
        <p th:text="${error}"></p>
    </div>
    <div id="result-loading" class="htmx-indicator loading-spinner-container">
        <div class="loading-spinner"></div>
        <p>Calculando...</p>
    </div>
</div>

<!-- Result state: conversion to all three currencies -->
<div th:if="${sourceCurrency != null}" id="result-section" class="result-area">
    <div class="conversion-results">
        <!-- BS card -->
        <div class="conversion-card" th:classappend="${sourceCurrency == 'BS'} ? 'source'">
            <span class="conversion-flag">&#x1F1FB;&#x1F1EA;</span>
            <span class="conversion-code">BS</span>
            <span class="conversion-label">Bolívares</span>
            <span class="conversion-amount" th:text="${bsFormatted}">Bs. 0,00</span>
            <span class="conversion-badge" th:if="${sourceCurrency == 'BS'}">Seleccionaste</span>
        </div>
        <!-- USD card -->
        <div class="conversion-card" th:classappend="${sourceCurrency == 'USD'} ? 'source'">
            <span class="conversion-flag">&#x1F1FA;&#x1F1F8;</span>
            <span class="conversion-code">USD</span>
            <span class="conversion-label">Dólar</span>
            <span class="conversion-amount" th:text="${usdFormatted}">$ 0.00</span>
            <span class="conversion-badge" th:if="${sourceCurrency == 'USD'}">Seleccionaste</span>
        </div>
        <!-- EUR card -->
        <div class="conversion-card" th:classappend="${sourceCurrency == 'EUR'} ? 'source'">
            <span class="conversion-flag">&#x1F1EA;&#x1F1FA;</span>
            <span class="conversion-code">EUR</span>
            <span class="conversion-label">Euro</span>
            <span class="conversion-amount" th:text="${eurFormatted}">€ 0.00</span>
            <span class="conversion-badge" th:if="${sourceCurrency == 'EUR'}">Seleccionaste</span>
        </div>
    </div>
    <div id="result-loading" class="htmx-indicator loading-spinner-container">
        <div class="loading-spinner"></div>
        <p>Calculando...</p>
    </div>
</div>

<!-- Fallback: no result and no error -->
<div th:if="${sourceCurrency == null && error == null}" id="result-section" class="result-area">
    <div class="result-placeholder">
        <svg class="placeholder-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
            <path d="M11 8v6M8 11h6"/>
        </svg>
        <p>El resultado de la conversión aparecerá aquí</p>
    </div>
    <div id="result-loading" class="htmx-indicator loading-spinner-container">
        <div class="loading-spinner"></div>
        <p>Calculando...</p>
    </div>
</div>
